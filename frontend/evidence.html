<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Upload Evidence</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand"
href="projects.html">

Promise vs Progress

</a>

<a class="btn btn-light"
href="projects.html">

Projects

</a>

</div>

</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">

Upload Project Evidence

</h2>

<form id="evidenceForm">

<div class="mb-3">

<label class="form-label">

Select Project

</label>

<select
id="project"
class="form-select">

</select>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
id="description"
class="form-control"
rows="4"></textarea>

</div>

<div class="row">

<div class="col-md-6">

<label>Latitude</label>

<input
id="latitude"
class="form-control"
type="number"
step="any">

</div>

<div class="col-md-6">

<label>Longitude</label>

<input
id="longitude"
class="form-control"
type="number"
step="any">

</div>

</div>

<div class="mt-3">

<label>Date Captured</label>

<input
id="captured_at"
class="form-control"
type="datetime-local">

</div>

<button
class="btn btn-primary w-100 mt-4">

Upload Evidence

</button>

</form>

<div
id="message"
class="mt-3">

</div>

</div>

</div>

</div>

</div>

</div>

<script src="js/api.js"></script>

<script src="js/evidence.js"></script>

</body>

</html>
