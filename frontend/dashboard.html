<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Promise vs Progress — Karnataka Roads</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0a0c0f;
      --surface:   #111318;
      --border:    #1e2128;
      --accent:    #f5a623;
      --accent2:   #e8441a;
      --green:     #2ecc71;
      --muted:     #4a5060;
      --text:      #dde1ea;
      --text-dim:  #7a8090;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Grid texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(245,166,35,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,166,35,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      padding: 2.5rem 2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .header-left {}

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    h1 span.vs {
      color: var(--accent2);
      margin: 0 0.15em;
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: 300;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--green);
      border: 1px solid var(--green);
      padding: 0.3rem 0.75rem;
      border-radius: 2px;
      align-self: flex-start;
      margin-top: 0.5rem;
    }

    .live-dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Stats bar ── */
    .stats-bar {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .stat {
      padding: 1.2rem 2rem;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }

    .stat-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .stat-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    /* ── Controls ── */
    .controls {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 0.75rem;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 360px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      padding: 0.6rem 0.9rem 0.6rem 2.2rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus { border-color: var(--accent); }

    .search-icon {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.8rem;
    }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      padding: 0.6rem 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus { border-color: var(--accent); }

    .btn-refresh {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }

    .btn-refresh:hover { background: var(--accent); color: var(--bg); }

    /* ── Main grid ── */
    main {
      position: relative;
      z-index: 10;
      padding: 1.5rem 2rem 3rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1px;
      background: var(--border);
    }

    /* ── Project card ── */
    .card {
      background: var(--surface);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: background 0.2s;
      animation: fadeUp 0.4s ease both;
    }

    .card:hover { background: #15181f; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-source {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-source::before {
      content: '';
      display: inline-block;
      width: 18px; height: 1px;
      background: var(--accent);
    }

    .card-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.6;
      flex: 1;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
    }

    .tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      padding: 0.2rem 0.6rem;
      border: 1px solid var(--border);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .tag.budget { border-color: var(--accent2); color: var(--accent2); }
    .tag.location { border-color: #3a7bd5; color: #6fa3f7; }
    .tag.date { border-color: var(--muted); }

    /* ── Empty / loading states ── */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { color: var(--accent2); }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 10;
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <p class="eyebrow">Karnataka Roads · Civic Data</p>
    <h1>Promise <span class="vs">vs</span> Progress</h1>
    <p class="subtitle">Tracking government budget promises against actual infrastructure project progress</p>
  </div>
  <div class="live-badge">
    <span class="live-dot"></span> Live from API
  </div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-value" id="stat-total">—</div>
    <div class="stat-label">Projects</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-sources">—</div>
    <div class="stat-label">Sources</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-budgeted">—</div>
    <div class="stat-label">With Budget</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-locations">—</div>
    <div class="stat-label">Locations</div>
  </div>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search projects..."/>
  </div>
  <select id="filter-source">
    <option value="">All Sources</option>
  </select>
  <select id="filter-location">
    <option value="">All Locations</option>
  </select>
  <button class="btn-refresh" onclick="loadProjects()">↻ Refresh</button>
</div>

<main>
  <div class="grid" id="grid">
    <div class="state-msg">
      <div class="spinner"></div>
      Loading projects from API...
    </div>
  </div>
</main>

<footer>
  <span>Promise vs Progress · Karnataka Road Infrastructure Tracker</span>
  <span id="last-updated">—</span>
</footer>

<script>
  const API = "http://127.0.0.1:8000/api/projects";
  let allProjects = [];

  async function loadProjects() {
    const grid = document.getElementById("grid");
    grid.innerHTML = `<div class="state-msg"><div class="spinner"></div>Fetching from API...</div>`;

    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allProjects = data.projects || [];
      populateFilters(allProjects);
      updateStats(allProjects);
      renderCards(allProjects);
      document.getElementById("last-updated").textContent =
        "Last updated: " + new Date().toLocaleTimeString();
    } catch (err) {
      grid.innerHTML = `
        <div class="state-msg error-msg">
          ⚠ Could not connect to API<br>
          <small style="color:var(--text-dim);margin-top:0.5rem;display:block">
            Make sure <code>uvicorn main:app --reload</code> is running
          </small>
        </div>`;
    }
  }

  function populateFilters(projects) {
    const sources   = [...new Set(projects.map(p => p.source).filter(Boolean))];
    const locations = [...new Set(projects.map(p => p.location).filter(Boolean))];

    const srcSel = document.getElementById("filter-source");
    const locSel = document.getElementById("filter-location");

    srcSel.innerHTML = `<option value="">All Sources</option>` +
      sources.map(s => `<option value="${s}">${s}</option>`).join("");

    locSel.innerHTML = `<option value="">All Locations</option>` +
      locations.map(l => `<option value="${l}">${l}</option>`).join("");
  }

  function updateStats(projects) {
    const sources   = new Set(projects.map(p => p.source).filter(Boolean));
    const locations = new Set(projects.map(p => p.location).filter(Boolean));
    const budgeted  = projects.filter(p => p.budget).length;

    document.getElementById("stat-total").textContent     = projects.length;
    document.getElementById("stat-sources").textContent   = sources.size;
    document.getElementById("stat-budgeted").textContent  = budgeted;
    document.getElementById("stat-locations").textContent = locations.size;
  }

  function renderCards(projects) {
    const grid = document.getElementById("grid");
    if (!projects.length) {
      grid.innerHTML = `<div class="state-msg">No projects match your filters.</div>`;
      return;
    }

    grid.innerHTML = projects.map((p, i) => `
      <div class="card" style="animation-delay:${i * 0.05}s">
        <div class="card-source">${p.source || "Unknown"}</div>
        <div class="card-name">${p.name || "Unnamed Project"}</div>
        <div class="card-desc">${p.description || "No description available."}</div>
        <div class="card-meta">
          ${p.location ? `<span class="tag location">📍 ${p.location}</span>` : ""}
          ${p.budget   ? `<span class="tag budget">₹ ${p.budget}</span>`      : ""}
          ${p.date     ? `<span class="tag date">🗓 ${p.date}</span>`          : ""}
        </div>
      </div>
    `).join("");
  }

  function applyFilters() {
    const query = document.getElementById("search").value.toLowerCase();
    const src   = document.getElementById("filter-source").value;
    const loc   = document.getElementById("filter-location").value;

    const filtered = allProjects.filter(p => {
      const text = `${p.name} ${p.description} ${p.location}`.toLowerCase();
      return (
        (!query || text.includes(query)) &&
        (!src   || p.source   === src)   &&
        (!loc   || p.location === loc)
      );
    });

    updateStats(filtered);
    renderCards(filtered);
  }

  document.getElementById("search").addEventListener("input", applyFilters);
  document.getElementById("filter-source").addEventListener("change", applyFilters);
  document.getElementById("filter-location").addEventListener("change", applyFilters);

  loadProjects();
</script>
</body>
</html>
