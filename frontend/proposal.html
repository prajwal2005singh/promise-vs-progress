<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Submit Proposal | Promise vs Progress</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            Promise vs Progress
        </a>

        <a href="projects.html" class="btn btn-light">
            Projects
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="mb-4 text-center">

                        Submit New Infrastructure Proposal

                    </h2>

                    <form id="proposalForm">

                        <div class="mb-3">

                            <label>Project Name</label>

                            <input
                                id="name"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Description</label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="4"
                                required></textarea>

                        </div>

                        <div class="mb-3">

                            <label>Category</label>

                            <select
                                id="category"
                                class="form-select">

                                <option>Road</option>
                                <option>Bridge</option>
                                <option>Tunnel</option>
                                <option>Flyover</option>
                                <option>Drainage</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label>Location</label>

                            <input
                                id="location"
                                class="form-control"
                                required>

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <label>Latitude</label>

                                <input
                                    id="latitude"
                                    type="number"
                                    step="any"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6">

                                <label>Longitude</label>

                                <input
                                    id="longitude"
                                    type="number"
                                    step="any"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="mt-3">

                            <label>Estimated Budget (₹)</label>

                            <input
                                id="budget"
                                type="number"
                                class="form-control">

                        </div>

                        <button
                            class="btn btn-primary w-100 mt-4">

                            Submit Proposal

                        </button>

                    </form>

                    <div
                        id="message"
                        class="text-center mt-3">

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/proposal.js"></script>

</body>

</html>
