<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login | Promise vs Progress</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            Promise vs Progress

        </a>

    </div>

</nav>



<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-body p-4">

<h2 class="text-center mb-4">

Login

</h2>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
class="form-control"
id="email"
required>

</div>


<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
class="form-control"
id="password"
required>

</div>


<button
type="submit"
class="btn btn-primary w-100">

Login

</button>

</form>

<div
id="message"
class="mt-3 text-center">

</div>

</div>

</div>

</div>

</div>

</div>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
